name: Submit an app
description: Suggest a GNOME app for the Vibe GNOME community directory.
title: "[App] "
body:
  - type: markdown
    attributes:
      value: |
        Basic metadata checks run automatically after submission and edits.
        A maintainer must then review and confirm your app before it can be listed.
  - type: input
    id: listing-id
    attributes:
      label: Listing ID
      description: Optional URL ID using lowercase letters, numbers, and hyphens. Keep it stable after publication. Defaults to submission-<issue-number>.
      placeholder: my-gnome-project
  - type: input
    id: name
    attributes:
      label: App name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository or project URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this app do and who is it for?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Installation and usage
      description: Include prerequisites, packaging, and a short usage example.
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Author and license
    validations:
      required: true
