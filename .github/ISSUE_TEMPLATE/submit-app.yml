name: Submit an app
description: Suggest a GNOME app for the Vibe GNOME community directory.
title: "[App] "
body:
  - type: input
    id: name
    attributes:
      label: App name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository or project URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this app do and who is it for?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Installation and usage
      description: Include prerequisites, packaging, and a short usage example.
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Author and license
    validations:
      required: true
