name: Submit an app
description: Suggest a GNOME app for the Vibe GNOME community directory.
title: "[App] "
body:
  - type: markdown
    attributes:
      value: |
        Basic metadata checks run automatically after submission and edits.
        A maintainer must then review and confirm your app before it can be listed.
  - type: input
    id: name
    attributes:
      label: App name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository or project URL
      description: Link to the repository root on GitHub, GitLab.com, or GNOME GitLab. The app ID is detected from its metadata.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Separate tags with commas.
      placeholder: productivity, notes, GTK
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this app do and who is it for?
    validations:
      required: true
