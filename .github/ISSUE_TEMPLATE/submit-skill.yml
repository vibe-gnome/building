name: Submit a skill
description: Suggest an agent skill for the Vibe Tools directory.
title: "[Skill] "
body:
  - type: input
    id: name
    attributes:
      label: Skill name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Repository or documentation URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this skill help an agent do when building GNOME software?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Installation and usage
      description: Include supported agents, prerequisites, and an example prompt.
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Author and license
    validations:
      required: true
