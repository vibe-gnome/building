name: Submit a skill
description: Submit a skill for installation checks, skills.sh audits, and maintainer review.
title: "[Skill] "
body:
  - type: markdown
    id: review-process
    attributes:
      value: |
        Submit one skill per issue. Provide its repository and the folder containing SKILL.md.
        We try installing the skill with npx skills add first, then check its skills.sh audits.
        The skill does not need to be listed on skills.sh before submission.
        Gen Agent Trust Hub and Socket must both show PASS before human review.
        A human maintainer reviews and approves the listing after the checks pass.
  - type: input
    id: name
    attributes:
      label: Skill name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source repository URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: skill-folder
    attributes:
      label: Skill folder path
      description: Path from the repository root to the folder containing SKILL.md. Use . for the repository root.
      placeholder: skills/skill-name
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional. Separate tags with commas.
      placeholder: GNOME, GTK, Libadwaita
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Optional. How does this skill help with GNOME development? Leave blank to use its SKILL.md description.
    validations:
      required: false
