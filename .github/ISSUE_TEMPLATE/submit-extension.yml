name: Submit an extension
description: Add a GNOME Shell extension to the marketplace.
title: "[Submit] "
body:
  - type: markdown
    attributes:
      value: |
        Share your GNOME Shell extension. The UUID and metadata.json are read automatically from your repository after submission and edits.
        A maintainer must then review and confirm the extension before it can be listed.
        Extensions follow the [official GNOME guidelines](https://gjs.guide/extensions/review-guidelines/review-guidelines.html).
  - type: input
    id: extension-name
    attributes:
      label: Extension name
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository
      description: Public repository root on GitHub, GitLab.com, or GNOME GitLab containing one extension metadata.json.
      placeholder: https://github.com/username/extension
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does the extension do? Mention any additional requirements.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category and tags
      placeholder: Workflow, workspaces, terminal
  - type: textarea
    id: preview
    attributes:
      label: Screenshots
      description: Optional. Attach screenshots or link to them in your repository and include attribution where needed.
