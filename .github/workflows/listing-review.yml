name: Listing review

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: App or extension submission issue number to check again
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (!github.event.issue.pull_request &&
      ((github.event_name == 'issues' && !startsWith(github.event.issue.title, '[Skill]') && !contains(github.event.issue.body, '### skills.sh URL') && !contains(github.event.issue.body, '### Skill folder path')) ||
      startsWith(github.event.comment.body, '/confirm-listing ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: listing-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted review code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify review and repository identity detection
        run: bun test tests/app-identity.test.ts tests/extension-identity.test.ts tests/repository-fetch.test.ts tests/repository-screenshot.test.ts tests/listing-review.test.ts
      - name: Verify the current extension form through review and publication
        run: bun test tests/extension-submission-workflow.test.ts
      - name: Verify publication safeguards before processing confirmation
        if: github.event_name == 'issue_comment'
        run: bun test tests/catalog-publication.test.ts tests/app-identity-migration.test.ts tests/listing-ids.test.ts
      - name: Detect repository app ID or extension UUID and record review status
        run: bun scripts/listing-review.ts --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the confirmed listing to D1
        if: github.event_name == 'issue_comment' && github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '/confirm-listing ')
        run: bun scripts/publish-listing.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
