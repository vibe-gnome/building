name: Listing review

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: App or extension submission issue number to check again
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (!github.event.issue.pull_request &&
      ((github.event_name == 'issues' && !startsWith(github.event.issue.title, '[Skill]') && !contains(github.event.issue.body, '### skills.sh URL')) ||
      startsWith(github.event.comment.body, '/confirm-listing ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: listing-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted review code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify review and repository identity detection
        run: bun test tests/app-identity.test.ts tests/extension-identity.test.ts tests/listing-review.test.ts
      - name: Verify the current extension form through review and publication
        run: bun test tests/extension-submission-workflow.test.ts
      - name: Detect repository app ID or extension UUID and record review status
        run: bun scripts/listing-review.ts --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
