name: Listing review

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: listing-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/confirm-listing '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted review code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: Check metadata and record review status
        run: bun scripts/listing-review.ts --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
