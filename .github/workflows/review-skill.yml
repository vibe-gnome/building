name: Review skill submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Skill submission issue number to check again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  security-audits:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[Skill]') ||
      contains(github.event.issue.body, '### skills.sh URL') ||
      contains(github.event.issue.labels.*.name, 'skill-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Check required audits and request human review
        run: bun scripts/review-skill-submission.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
