name: Publish reviewed listing to D1
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Submission issue number
        required: true
        type: string
      approval_comment_id:
        description: Numeric ID of an existing, unedited human approval comment
        required: true
        type: string
permissions:
  contents: read
  issues: read
jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '/publish-listing '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only eligible jobs take the lock; skipped review jobs cannot displace publication.
    concurrency:
      group: listing-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify publication and database identity constraints
        run: bun test tests/catalog-publication.test.ts tests/app-identity-migration.test.ts tests/listing-ids.test.ts tests/extension-identity.test.ts tests/repository-screenshot.test.ts
      - name: Verify the current extension form through review and publication
        run: bun test tests/extension-submission-workflow.test.ts
      - name: Verify human approval, repository identity, and database schema, then publish
        run: bun scripts/publish-listing.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
